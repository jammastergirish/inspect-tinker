[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-tinker"
version = "0.1.1"
description = "A Tinker-backed model provider for Inspect AI — use a Tinker checkpoint as tinker/<path>."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Girish Gupta", email = "girish@girishgupta.com" }]
keywords = ["inspect-ai", "tinker", "llm", "evals", "model-provider", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.261",
    "tinker",
    "transformers>=4.44",
]

[project.urls]
Homepage = "https://github.com/jammastergirish/inspect-tinker"
Repository = "https://github.com/jammastergirish/inspect-tinker"
Issues = "https://github.com/jammastergirish/inspect-tinker/issues"

# This is what makes Inspect auto-discover the provider after `pip install`:
# Inspect imports the named module, which runs the @modelapi registration.
[project.entry-points.inspect_ai]
inspect_tinker = "inspect_tinker._registry"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_tinker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
